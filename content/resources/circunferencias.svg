<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 360" role="img" aria-labelledby="ct cd" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif">
<title id="ct">Circunferencias exterior, primitiva e interior de un engranaje recto, con sus diámetros</title>
<desc id="cd">Rueda dentada de 16 dientes con tres circunferencias concéntricas: la exterior toca la punta de los dientes, la primitiva los corta por la zona de contacto y la interior pasa por su base. Debajo, tres cotas horizontales con sus diámetros: D sub e, D sub p y D sub i, de mayor a menor.</desc>
