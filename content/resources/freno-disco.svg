<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="dt dd" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif">
<title id="dt">Freno de disco, en corte</title>
<desc id="dd">Corte de un freno de disco de pinza flotante. El disco, d, gira en vertical en el centro; la pinza lo abraza por arriba con una pastilla, p, a cada lado. Al llegar el líquido de frenos por el tubo, empuja el pistón, que aprieta la pastilla de su lado contra el disco; la pinza se desliza en sentido contrario y arrastra la otra pastilla contra la otra cara. El disco, que bajaba girando, se frena hasta pararse; al soltar, todo vuelve atrás y el disco gira de nuevo.</desc>
