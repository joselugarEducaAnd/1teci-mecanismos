<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mecanismos en movimiento</title>
<style>
:root{color-scheme:light;--olive:#817431;--ink:#292a23;--muted:#66685d;--paper:#f7f7f1;--line:#dfdfd1;--blue:#405ab5;--orange:#c76c30}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button{min-height:42px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}button:hover{background:#efefe5}button[aria-pressed=true],button.primary{background:var(--olive);border-color:var(--olive);color:white}button:disabled{opacity:.45;cursor:default}a{color:var(--olive)}main{max-width:1220px;margin:auto;padding:28px 24px 20px}header{display:flex;align-items:center;gap:24px;justify-content:space-between;margin-bottom:22px}.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);font-weight:650}h1{font-size:clamp(24px,3vw,34px);font-weight:600;letter-spacing:-.025em;margin:4px 0}header p{margin:0;color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}nav button{flex:1;white-space:nowrap}.workspace{display:grid;align-items:start;grid-template-columns:minmax(0,1fr) 276px;gap:18px}.visual{min-width:0;border:1px solid var(--line);border-radius:14px;background:white;overflow:hidden}.views{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}.views button{font-size:13px;padding:4px 9px;min-height:34px}.views label{margin-left:auto;font-size:13px}#stage{height:430px;position:relative;background:linear-gradient(#f8f9f5,#eeefe5)}#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline-offset:-4px}.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.piece-label{position:absolute;font-size:12px;background:#fffffff0;border:1px solid #dedfd4;border-radius:6px;padding:2px 6px;transform:translate(-50%,-50%);white-space:nowrap}.legend{display:flex;gap:18px;flex-wrap:wrap;padding:8px 14px;font-size:13px;border-top:1px solid var(--line)}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.playback{padding:14px;border-top:1px solid var(--line)}.transport{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.transport .primary{min-width:120px}.transport label{margin-left:auto;font-size:13px}.transport select{border:1px solid var(--line);border-radius:6px;padding:6px;background:white;color:var(--ink)}.timeline{display:flex;gap:14px;align-items:center;margin-top:12px}.timeline input{flex:1;min-width:0}.timeline output{font-size:13px;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}input[type=range]{accent-color:var(--olive);width:100%}.panel{border:1px solid var(--line);border-radius:14px;background:#fff;padding:18px;align-self:start}.panel h2{font-size:18px;margin:0 0 16px;font-weight:600}.control{margin-bottom:17px}.control>label{display:flex;justify-content:space-between;gap:8px;font-size:14px}.control output{font-variant-numeric:tabular-nums;font-weight:600}.control select{width:100%;padding:8px;margin-top:6px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink)}#params .control:last-child{margin-bottom:12px}.metrics{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.metric{display:flex;justify-content:space-between;gap:12px;font-size:14px}.metric strong{font-variant-numeric:tabular-nums;text-align:right}.formula{font-size:14px;text-align:center;color:var(--olive);padding-top:15px}#explanation{margin:18px 0 0;padding:16px 0;border-top:1px solid var(--line)}#explanation h2{margin:0 0 5px;font-size:19px;font-weight:600}#explanation p{margin:0;max-width:950px;color:var(--muted)}#challenge{color:var(--ink)!important;margin-top:8px!important}.hint{font-size:12px;color:var(--muted);margin:12px 0 0}.error{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px}.error[hidden]{display:none}footer{font-size:12px;color:var(--muted);margin-top:16px;display:flex;justify-content:space-between;gap:12px}.hidden{display:none!important}
@media(max-width:850px){.workspace{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}.panel h2{grid-column:1/-1}.metrics{margin:0;border:0;padding:0}.formula{grid-column:1/-1}#restore{grid-column:1/-1}#stage{height:380px}}
@media(max-width:480px){main{padding:18px 12px}header{margin-bottom:15px}header p{font-size:14px}nav button{flex:1 1 45%;white-space:normal;padding:8px;font-size:14px}.panel{display:block}#stage{height:300px}.transport label{margin-left:0;width:100%}.transport button{padding:8px 10px}.metrics{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.views label{margin-left:0;width:100%}.piece-label{font-size:11px}.legend{gap:10px}footer{flex-direction:column}.transport .primary{min-width:104px}}

nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}nav button{white-space:normal}
@media(max-width:850px){nav{grid-template-columns:repeat(2,minmax(0,1fr))}}

[hidden]{display:none!important}
#start-overlay{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;padding:18px;text-align:center;background:#eeefe9}
#start-name{font-size:22px;font-weight:600;margin:0}
#start-simulation{font-size:18px;min-height:64px;padding:16px 22px;background:var(--blue);color:white;border-color:var(--blue)}
.not-started .playback,.not-started .legend,.not-started .views>button:not(#open-new),.not-started .views>label{display:none}
.failed .playback,.failed .legend{display:none}
#open-new{margin-left:auto}
#scene-title{display:none}
.panel,.formula,.metric{min-width:0;overflow-wrap:anywhere}
.metric strong{min-width:0}
.embedded main{padding:8px;max-width:1220px}
.embedded .workspace{grid-template-columns:minmax(0,1fr) minmax(270px,34%);gap:12px}
.embedded #stage{height:auto;aspect-ratio:2;max-height:320px}
.embedded .panel{display:block;padding:12px;max-height:560px;overflow-y:auto;overscroll-behavior:contain}
.embedded .panel h2{display:none}
.embedded .control{margin-bottom:10px}
.embedded .control select{padding:6px}
.embedded .metrics{gap:7px;margin-top:10px;padding-top:10px}
.embedded .playback{padding:10px}
.embedded .transport{gap:5px}
.embedded .transport button{font-size:13px;min-height:36px;padding:6px 8px}
.embedded .transport .primary{min-width:102px}
.embedded .transport label{font-size:12px}
.embedded .timeline{gap:8px;margin-top:8px}
.embedded .views{padding:7px;gap:4px}
.embedded .views label{margin-left:0}
.embedded #explanation{margin:8px 0 0;padding:0;border:0}
.embedded #challenge{font-size:14px;line-height:1.4;margin:0!important;max-width:none}
@media(max-width:759px){
 .embedded .workspace{grid-template-columns:minmax(0,1fr)}
 .embedded .panel{max-height:none;overflow:visible}
 .embedded #stage{aspect-ratio:1.25;max-height:none}
 .embedded .transport label{width:100%;margin-left:0}
 .embedded #open-new{margin-left:0}
}
</style>

<body>
<main id="mechanisms">
<header><div><h1>Mecanismos en movimiento</h1></div></header>
<nav aria-label="Elegir mecanismo">
<button type="button" data-scene="engranajes" aria-pressed="true">Engranajes y trenes</button>
<button type="button" data-scene="tipos" aria-pressed="false">Tipos de engranajes</button>
<button type="button" data-scene="dentada" aria-pressed="false">Cadena y correa dentada</button>
<button type="button" data-scene="caja" aria-pressed="false">Caja de velocidades</button>
<button type="button" data-scene="friccion" aria-pressed="false">Ruedas de fricción</button>
<button type="button" data-scene="correa" aria-pressed="false">Poleas y correas</button>
<button type="button" data-scene="biela" aria-pressed="false">Biela-manivela</button>
<button type="button" data-scene="cardan" aria-pressed="false">Junta cardán</button>
<button type="button" data-scene="palanca" aria-pressed="false">Palancas</button>
<button type="button" data-scene="polea" aria-pressed="false">Poleas para elevar cargas</button>
<button type="button" data-scene="polipasto" aria-pressed="false">Polipastos</button>
</nav>
<div class="workspace">
<section class="visual" aria-label="Animación tridimensional">
<div class="views"><button type="button" data-view="perspectiva">3D</button><button type="button" data-view="frontal">Frontal</button><button type="button" data-view="lateral">Lateral</button><button type="button" data-view="superior">Superior</button><button type="button" id="zoom-in" aria-label="Acercar cámara">＋</button><button type="button" id="zoom-out" aria-label="Alejar cámara">−</button><label><input id="labels-toggle" type="checkbox" checked> Nombres</label><label id="geometry-option"><input id="geometry-toggle" type="checkbox"> Circunferencias</label></div>
<div id="stage"><div class="labels" id="labels"></div><div class="error" id="error" hidden></div></div>
<div class="legend" id="legend"></div>
<div class="playback">
<div class="transport"><button type="button" id="back" aria-label="Retroceder cinco grados">◀ Paso</button><button type="button" id="play" class="primary" aria-pressed="false">▶ Reproducir</button><button type="button" id="forward" aria-label="Avanzar cinco grados">Paso ▶</button><button type="button" id="reset">↺ Inicio</button><label>Reproducción <select id="rate" aria-label="Velocidad de reproducción"><option value="0.025">0,025×</option><option value="0.05" selected>0,05×</option><option value="0.1">0,1×</option><option value="0.25">0,25×</option><option value="0.5">0,5×</option><option value="1">1×</option></select></label></div>
<div class="timeline"><label for="phase" class="hidden">Posición angular de entrada</label><input id="phase" type="range" min="0" max="1440" step="1" value="0" aria-label="Posición angular de entrada"><output id="phase-value" for="phase">0°</output></div>
</div>
</section>
<aside class="panel" aria-label="Parámetros y resultados"><h2 id="param-title">Tu mecanismo</h2><div id="params"></div><div><div class="metrics" id="metrics"></div><div class="formula" id="formula"></div></div><button type="button" id="restore">Recuperar ejemplo</button></aside>
</div>
<section id="explanation" aria-live="polite"><h2 id="scene-title"></h2><p id="scene-text"></p><p id="challenge"></p></section>
<p class="hint">Arrastra para girar la cámara; usa la rueda o pellizca con dos dedos para acercar. Con la animación enfocada: espacio reproduce o pausa y las flechas recorren el movimiento.</p>

</main>
